  });
  return fetch('https://formsubmit.co/ajax/ydt009@gmail.com', {

};

  componentDidMount() {
    this.timer = setInterval(() => {
      const st = this.state;
      const u = { tick: st.tick + 1 };
      if (st.phase === 'run') u.mt = st.mt + 1;
      this.setState(u);
    }, 100);
    this.revealTimer = setTimeout(() => {
      const els = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window)) { els.forEach((el) => el.classList.add('in')); return; }
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (en.isIntersecting) { en.target.classList.add('in'); this.io.unobserve(en.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      els.forEach((el) => this.io.observe(el));
    }, 60);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.burstTimer);
    clearTimeout(this.revealTimer);
    if (this.io) this.io.disconnect();

  renderVals() {

      stx[n.id] = isLive ? 'פעיל' : (ready ? 'מוכן ✓' : 'בבנייה…');
    });

    const doneStyle = 'background: #0B0D12; border: 1px solid #23263A;';
    const activeStyle = 'background: #12141B; border: 1px solid ' + accent + ';';
    const idleStyle = 'background: #0B0D12; border: 1px solid #1A1D29; opacity: .55;';
    const dotDone = 'background: ' + accent + '; color: #07080B;';
    const dotActive = 'background: #F2F3F5; color: #07080B;';
    const dotIdle = 'background: #1C2030; color: #8C92A4;';

    const stage = isPick ? 0 : (isBuild ? 1 : 2);
    const isDone = (i) => i < stage || (i === 2 && isLive);
    const stStyle = (i) => isDone(i) ? doneStyle : (i === stage ? activeStyle : idleStyle);
    const dotStyle = (i) => isDone(i) ? dotDone : (i === stage ? dotActive : dotIdle);
    const mark = (i) => isDone(i) ? '✓' : String(i + 1);

    const fc = isLive ? Math.floor((s.mt - BUILD - COUNT) / 12) + 1 : 0;
    const feed = [];

      for (let j = fc - 1; j >= Math.max(0, fc - 4); j--) {
        const n = selected[j % selected.length];

        feed.push({
          text: P.ev[n.id],
          color: n.color,
          time: ago === 0 ? 'עכשיו' : 'לפני ' + (ago * 4 + 1) + ' שניות',
          style: ago === 0 ? 'background: ' + accent + '14;' : 'background: transparent; opacity: ' + (1 - ago * 0.18) + ';'
        });
      }
    }
    let cLeads = 0, cAuto = 0;
    selected.forEach((n, p) => {
      const c = fc > p ? Math.floor((fc - 1 - p) / selected.length) + 1 : 0;
      if (n.kind === 'lead') cLeads += c; else cAuto += c;
    });

    const lt = isLive ? s.mt - BUILD - COUNT : 0;
    const DEALS = P.deals;

      { num: '04', title: 'מערכות CRM לניהול לקוחות', desc: 'כל ליד, כל שיחה וכל עסקה במקום אחד. אף לקוח לא נופל בין הכיסאות.' },
      { num: '05', title: 'אוטומציות עסקיות', desc: 'העבודה השחורה עוברת למכונה, ואתם מתפנים לנהל את העסק.' },
      { num: '06', title: 'מיילים ותזכורות אוטומטיים', desc: 'אישורים, תזכורות ומעקב שנשלחים בדיוק בזמן – בלי שתצטרכו לזכור.' },
      { num: '07', title: 'טפסים דיגיטליים מורכבים', desc: 'טפסים רב־שלביים עם לוגיקה מותנית, חתימה דיגיטלית והעלאת קבצים – ישר אל תוך המערכת.' }
    ].map((sv, i) => Object.assign({}, sv, { delay: 'transition-delay: ' + (i * 70) + 'ms;' }));

    const simSummary = isRun ? (BIZ[s.biz] + ' · ' + selected.map((n) => n.label).join(', ')) : '';
    const sending = s.fStatus === 'sending';
    const errKey = { fName: 'name', fPhone: 'phone', fEmail: 'email', fMsg: 'msg' };
    const field = (k) => (e) => {
